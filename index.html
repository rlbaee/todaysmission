<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="assets/js/index.js" defer></script>
    <link rel="stylesheet" href="assets/css/index.css" />

    <title>Today's Mission</title>
  </head>
  <body>
    <main class="container">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">TM</span>
        <span>Today's Mission</span>
      </div>

      <div class="content-row">
        <section
          class="mission-content"
          id="mission-card"
          role="button"
          tabindex="0"
          aria-label="Get a new mission"
          aria-live="polite"
        >
          <p class="eyebrow">Mission</p>
          <h1 id="mission">
            Loading mission...
          </h1>
        </section>
      </div>
    </main>

    <footer class="site-footer">
      <span>Today's Mission</span>
      <span aria-hidden="true">·</span>
      <span>v1.3.0</span>
    </footer>

    <aside
      class="changelog"
      id="changelog"
      aria-labelledby="changelog-title"
      hidden
    >
      <div>
        <p class="changelog-label">What's new</p>
        <h2 id="changelog-title">A little more atmosphere</h2>
        <p>Slow-moving color behind the card makes the glass effect easier to see.</p>
      </div>
      <button class="changelog-close" id="changelog-close" type="button">
        Got it
      </button>
    </aside>
  </body>
</html>
