<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="assets/js/index.js" defer></script>
    <link rel="stylesheet" href="assets/css/index.css" />

    <title>Today's Mission</title>
  </head>
  <body>
    <main class="container">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">TM</span>
        <span>Today's Mission</span>
      </div>

      <div class="content-row">
        <section class="mission-content" aria-live="polite">
          <p class="eyebrow">Mission</p>
          <h1 id="mission">
            When meeting new people, tell each one another name.
          </h1>
        </section>

        <div class="action-area">
          <button id="generate-mission" type="button">
            <span>New mission</span>
            <span class="button-arrow" aria-hidden="true">↗</span>
          </button>
        </div>
      </div>
    </main>
  </body>
</html>
